# What `master` has to pass: the package's tests on each of Meadow's
# runtimes, and the formatter with nothing to change. Meadow is the nightly.

name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Meadow (nightly)
        run: |
          curl -fsSL https://raw.githubusercontent.com/meadow-lang/meadow/master/scripts/meadowup-init.sh | sh -s -- --version nightly
          echo "$HOME/.meadow/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: |
          meadow --version
          clang --version

      - name: Format
        run: meadow fmt --check src

      - name: Test (Glade)
        run: meadow test
      - name: Test (Silo)
        run: meadow test --runtime silo
